openapi: 3.0.3
info:
  title: MUSE Backend API
  version: 1.0.0
  description: Firebase-authenticated REST API. All data is scoped to the bearer token's UID.
servers:
  - url: https://asia-south1-YOUR_FIREBASE_PROJECT_ID.cloudfunctions.net/api
    description: Replace with the HTTPS URL printed by Firebase deployment
  - url: http://127.0.0.1:5001/YOUR_FIREBASE_PROJECT_ID/asia-south1/api
    description: Local emulator
security:
  - firebaseAuth: []
components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  parameters:
    id:
      in: path
      name: id
      required: true
      schema: {type: string}
    day:
      in: path
      name: date
      required: true
      schema: {type: string, format: date}
    pagination:
      in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    cursor:
      in: query
      name: after
      schema: {type: string}
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
    WardrobeInput:
      type: object
      additionalProperties: false
      required: [name, category]
      properties:
        name: {type: string, maxLength: 100}
        category: {type: string, enum: [top, bottom, dress, outerwear, shoes, accessory]}
        color: {type: string, nullable: true, maxLength: 40}
        season: {type: string, enum: [spring, summer, autumn, winter, all]}
        occasions:
          type: array
          maxItems: 5
          uniqueItems: true
          items: {type: string, enum: [casual, work, formal, sport, travel]}
        imagePath: {type: string, nullable: true, description: 'Storage path under users/{uid}/wardrobe/{itemId}/; set after creation'}
        notes: {type: string, nullable: true, maxLength: 500}
        archived: {type: boolean}
    Wardrobe:
      allOf:
        - $ref: '#/components/schemas/WardrobeInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: {type: string}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    OutfitInput:
      type: object
      additionalProperties: false
      required: [name, itemIds]
      properties:
        name: {type: string, maxLength: 100}
        itemIds: {type: array, minItems: 1, maxItems: 30, uniqueItems: true, items: {type: string}}
        occasion: {type: string, enum: [casual, work, formal, sport, travel]}
        season: {type: string, enum: [spring, summer, autumn, winter, all]}
        notes: {type: string, nullable: true, maxLength: 500}
    Outfit:
      allOf:
        - $ref: '#/components/schemas/OutfitInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: {type: string}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    PlanInput:
      type: object
      additionalProperties: false
      required: [outfitId]
      properties:
        outfitId: {type: string}
        notes: {type: string, nullable: true, maxLength: 500}
    Plan:
      allOf:
        - $ref: '#/components/schemas/PlanInput'
        - type: object
          properties:
            date: {type: string, format: date}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    PackingInput:
      type: object
      additionalProperties: false
      required: [name, startDate, endDate, outfitIds]
      properties:
        name: {type: string, maxLength: 100}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        outfitIds: {type: array, maxItems: 30, uniqueItems: true, items: {type: string}}
        extraItemIds: {type: array, maxItems: 30, uniqueItems: true, items: {type: string}}
    PackingItem:
      type: object
      properties:
        itemId: {type: string}
        name: {type: string}
        category: {type: string}
        quantity: {type: integer, minimum: 1}
        packed: {type: boolean}
    PackingList:
      allOf:
        - $ref: '#/components/schemas/PackingInput'
        - type: object
          properties:
            id: {type: string}
            items: {type: array, items: {$ref: '#/components/schemas/PackingItem'}}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    Recommendation:
      type: object
      properties:
        itemIds: {type: array, items: {type: string}}
        score: {type: integer}
  responses:
    Error:
      description: Request error (400, 401, 404, 409, 413, 422, or 500)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NoContent:
      description: Deleted
paths:
  /health:
    get:
      security: []
      summary: Liveness check
      responses:
        '200': {description: OK}
  /v1/me:
    get:
      summary: Current authenticated user
      responses:
        '200':
          description: Firebase user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid: {type: string}
                  email: {type: string, nullable: true}
                  displayName: {type: string, nullable: true}
        default: {$ref: '#/components/responses/Error'}
  /v1/wardrobe:
    get:
      summary: List wardrobe items by document ID
      parameters: [{$ref: '#/components/parameters/pagination'}, {$ref: '#/components/parameters/cursor'}]
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Wardrobe'}}
                  nextCursor: {type: string, nullable: true}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Create wardrobe item
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WardrobeInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Wardrobe'}
        default: {$ref: '#/components/responses/Error'}
  /v1/wardrobe/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      summary: Get wardrobe item
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Wardrobe'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      summary: Update wardrobe item (subset of WardrobeInput)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WardrobeInput'}
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Wardrobe'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: Delete item if no outfit references it
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}
  /v1/outfits:
    get:
      summary: List outfits
      parameters: [{$ref: '#/components/parameters/pagination'}, {$ref: '#/components/parameters/cursor'}]
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Outfit'}}
                  nextCursor: {type: string, nullable: true}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Create outfit from owned, active wardrobe items
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OutfitInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Outfit'}
        default: {$ref: '#/components/responses/Error'}
  /v1/outfits/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      summary: Get outfit
      responses:
        '200':
          description: Outfit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Outfit'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      summary: Update outfit (subset of OutfitInput)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OutfitInput'}
      responses:
        '200':
          description: Updated outfit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Outfit'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: Delete outfit if no plan or packing list references it
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}
  /v1/recommendations:
    get:
      summary: Up to 10 rule-based outfit combinations
      parameters:
        - in: query
          name: occasion
          schema: {type: string, enum: [casual, work, formal, sport, travel]}
        - in: query
          name: season
          schema: {type: string, enum: [spring, summer, autumn, winter, all]}
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Recommendation'}}
                  method: {type: string, enum: [rule-based-v1]}
        default: {$ref: '#/components/responses/Error'}
  /v1/planner:
    get:
      summary: Plans in inclusive date range, maximum 366 days
      parameters:
        - in: query
          name: from
          required: true
          schema: {type: string, format: date}
        - in: query
          name: to
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Plan'}}
        default: {$ref: '#/components/responses/Error'}
  /v1/planner/{date}:
    parameters: [{$ref: '#/components/parameters/day'}]
    put:
      summary: Create or replace plan for a calendar date
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanInput'}
      responses:
        '200':
          description: Saved plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: Remove plan
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}
  /v1/packing-lists:
    get:
      summary: List packing lists
      parameters: [{$ref: '#/components/parameters/pagination'}, {$ref: '#/components/parameters/cursor'}]
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PackingList'}}
                  nextCursor: {type: string, nullable: true}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Generate a snapshot packing list
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PackingInput'}
      responses:
        '201':
          description: Generated list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackingList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/packing-lists/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      summary: Get packing list
      responses:
        '200':
          description: List
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackingList'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: Delete packing list
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        default: {$ref: '#/components/responses/Error'}
  /v1/packing-lists/{id}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/id'
      - in: path
        name: itemId
        required: true
        schema: {type: string}
    patch:
      summary: Mark item packed or unpacked
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [packed]
              properties:
                packed: {type: boolean}
      responses:
        '200':
          description: Updated list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PackingList'}
        default: {$ref: '#/components/responses/Error'}
