name: Release APK and IPA

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: muse-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          else
            echo "::warning::KEYSTORE_BASE64 not set, APK signed with debug key"
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name APK
        run: cp build/app/outputs/flutter-apk/app-release.apk muse-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: muse-frontend/muse-${{ github.ref_name }}.apk
          generate_release_notes: true

  ipa:
    needs: apk
    runs-on: macos-latest
    defaults:
      run:
        working-directory: muse-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Google Sign-In
        env:
          IOS_CLIENT_ID: ${{ vars.IOS_CLIENT_ID }}
        run: |
          if [ -z "$IOS_CLIENT_ID" ]; then
            echo "::warning::IOS_CLIENT_ID not set, Google sign-in will not work on iOS"
            exit 0
          fi
          REVERSED="com.googleusercontent.apps.${IOS_CLIENT_ID%.apps.googleusercontent.com}"
          sed -i '' "s|REPLACE_IOS_CLIENT_ID|$IOS_CLIENT_ID|; s|REPLACE_REVERSED_CLIENT_ID|$REVERSED|" ios/Runner/Info.plist

      - run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr muse-${{ github.ref_name }}-unsigned.ipa Payload

      - uses: softprops/action-gh-release@v2
        with:
          files: muse-frontend/muse-${{ github.ref_name }}-unsigned.ipa
